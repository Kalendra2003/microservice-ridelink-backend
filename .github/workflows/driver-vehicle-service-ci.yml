name: Driver & Vehicle Service CI

on:
  push:
    branches: [ main, 'feature/**' ]
    paths:
      - 'driver-vehicle-service/**'
      - '.github/workflows/driver-vehicle-service-ci.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'driver-vehicle-service/**'
      - '.github/workflows/driver-vehicle-service-ci.yml'
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: driver-vehicle-service
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Make Maven wrapper executable
        run: chmod +x mvnw

      # Unit tests use mocks only: no MongoDB and no secrets are needed in CI.
      - name: Build and run unit tests
        run: ./mvnw -B clean verify

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: driver-vehicle-service-test-reports
          path: driver-vehicle-service/target/surefire-reports