spring.application.name=driver-service
server.port=${SERVER_PORT:8082}

# Each service owns its own database (no shared DB across services)
spring.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/ridelink_driver_db}
spring.data.mongodb.auto-index-creation=true

# Shared HS256 secret used to verify JWTs issued by the Account Service.
# Must be supplied through the environment (never commit it). Minimum 32 characters.
app.jwt.secret=${JWT_SECRET}

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method